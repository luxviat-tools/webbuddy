<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab Dock · webbuddy</title>
<link rel="stylesheet" href="tabdock.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="4" width="13" height="16" rx="2"></rect>
      <path d="M8 4h10a2 2 0 0 1 2 2v12"></path>
    </svg>
    <span>Tab Dock</span>
    <span class="sub">built into webbuddy</span>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="Search group names, notes, titles or URLs…" autocomplete="off">
  </div>
  <div class="top-actions">
    <button id="btn-io" class="top-btn">Import &amp; Export</button>
    <button id="btn-options" class="top-btn">Settings</button>
  </div>
</header>

<div class="wrap">
  <aside class="rail">
    <label class="named-only"><input type="checkbox" id="named-only"> Named groups only</label>
    <div class="rail-tag">Library</div>
    <nav id="rail"></nav>
  </aside>

  <main class="content">
    <div class="content-head">
      <div class="title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 7a2 2 0 0 1 2-2h3.6l1.7 2H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        </svg>
        <span id="ch-name">All</span>
        <span id="ch-count" class="count">0</span>
      </div>
      <div class="right">
        <button id="btn-collect-all" class="collect-all" title="Dock every tab from all windows here, then close them to free memory">Dock all windows</button>
        <button id="btn-view-more" class="icon-act" title="More actions">⋮</button>
      </div>
    </div>

    <div id="cards" class="cards"></div>

    <div id="empty" class="empty" hidden>
      <h2>Nothing here yet</h2>
      <p>Hit “Dock all windows” in the top-right, or right-click any page → 🗂 Tab Dock → Dock current / all tabs.</p>
      <p>Each dock action becomes one group; drag any page between groups to reorganise.</p>
    </div>
  </main>
</div>

<div id="menu" class="menu" hidden></div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="file" accept=".json,.txt,text/plain" hidden>

<script src="tabdock-store.js"></script>
<script src="tabdock-page.js"></script>
</body>
</html>
