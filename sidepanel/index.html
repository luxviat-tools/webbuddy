<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>webbuddy</title>
<link rel="stylesheet" href="../libs/github.min.css">
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>

<header id="topbar">
  <select id="model-select" class="model-select" title="Switch model"></select>
  <div class="spacer"></div>
  <button id="btn-tabdock" class="td-btn" title="Tab Dock — dock and manage tabs" aria-label="Tab Dock">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="4" width="13" height="16" rx="2"></rect>
      <path d="M8 4h10a2 2 0 0 1 2 2v12"></path>
    </svg>
  </button>
  <button id="btn-ad" class="ad-btn" title="Ad block" aria-label="Ad block">Ad</button>
  <button id="btn-img" class="img-toggle" title="Image display" aria-label="Image display mode"></button>
  <button id="btn-new" class="icon-btn" title="New chat (clear the timeline)">＋</button>
  <button id="btn-settings" class="icon-btn" title="Settings">⚙</button>
</header>

<main id="thread">
  <div id="empty" class="empty">
    <p class="empty-title">Select text on a page, then right-click → Ask AI</p>
    <p class="empty-sub">Or ask in the box below — answers stream in here.</p>
    <button id="btn-go-settings" class="link-btn" hidden>Set up your API first →</button>
  </div>
</main>

<section id="tabdock-view" hidden>
  <div class="td-toolbar">
    <button id="td-collect" class="td-act primary" title="Dock every tab in this window, then close them to free memory">Dock window</button>
    <span class="td-spacer"></span>
    <button id="td-expand-all" class="td-act link" title="Expand every group at once (click again to collapse all)">Expand all</button>
    <button id="td-open-page" class="td-act link" title="Open the full manager in a new tab: folders, trash, drag & drop, more menus">Manager ↗</button>
    <button id="td-import" class="td-act link" title="Import: JSON backup or plain text">Import</button>
    <button id="td-export" class="td-act link" title="Export as plain text">Export</button>
  </div>
  <div id="td-status" class="td-status" hidden></div>
  <div id="td-list" class="td-list"></div>
  <div id="td-empty" class="td-empty">No docked tabs yet.<br>Hit “Dock window” above to stash your open pages;<br>or right-click a page → 🗂 Tab Dock → Dock current / all tabs.</div>
  <input type="file" id="td-file" accept=".json,.txt,text/plain" hidden>
</section>

<nav id="nav-dots" class="nav-dots" hidden>
  <button id="nav-top" class="nav-arrow" title="Back to top">↑</button>
  <div id="nav-list" class="nav-list"></div>
  <button id="nav-bottom" class="nav-arrow" title="Back to bottom">↓</button>
</nav>

<footer id="footer-bar">
  <div id="ctx-chip" class="ctx-chip" hidden>
    <span id="ctx-chip-text"></span>
    <button id="ctx-chip-close" title="Remove reference">✕</button>
  </div>
  <div id="status-bar" class="status-bar" hidden></div>
  <div id="shot-preview" class="shot-preview" hidden>
    <img id="shot-img" alt="Screenshot preview">
    <div class="shot-prompts" id="shot-prompts"></div>
    <div class="shot-foot">
      <span class="shot-hint">Pick a question above, or type a follow-up and send</span>
      <button id="shot-cancel" class="shot-cancel" type="button">✕ Cancel</button>
    </div>
  </div>
  <div class="input-row">
    <button id="btn-shot" class="shot-btn" title="Screenshot question" aria-label="Screenshot question">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
        <circle cx="12" cy="13" r="4"></circle>
      </svg>
    </button>
    <textarea id="input" rows="1" placeholder="Ask a follow-up… (Enter to send, Shift+Enter for newline)"></textarea>
    <button id="btn-send" class="send-btn" title="Send" disabled>➤</button>
    <button id="btn-stop" class="stop-btn" title="Stop generating" hidden>■</button>
  </div>
</footer>

<script src="../libs/marked.min.js"></script>
<script src="../libs/purify.min.js"></script>
<script src="../libs/highlight.min.js"></script>
<script src="../common.js"></script>
<script src="../tabdock-store.js"></script>
<script src="sidepanel.js"></script>
<script src="tabdock.js"></script>
</body>
</html>
